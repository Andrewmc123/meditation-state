# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Meditation State is a pure static site: Vite emits index.html plus one JS
# bundle, and everything else is data. There is no server, no API and no
# database, so this is a single static service.
#
# The build is unusual in one respect: roughly 60 MB of textures and
# catalogues are downloaded from NASA, Solar System Scope, astronexus and the
# three.js repository at build time rather than committed. Keeping ~107 MB of
# binaries out of git keeps the history usable, and every source is a stable
# public URL. A cold build takes about 90 seconds, most of it download.
#
# Deploy: push this file to the repo, then in Render choose
# New > Blueprint and point it at the repository.

services:
  - type: web
    name: meditation-state
    runtime: static
    plan: free

    # build:deploy = assets && build-catalog --prune-8k && vite build
    #   assets      downloads ~97 MB of 8K maps, the star catalogue and the
    #               character models
    #   --prune-8k  packs 119,626 stars into stars.bin, derives the 4K level
    #               from each 8K map, then deletes the 8K sources
    # The published site therefore tops out at 4K and weighs ~31 MB rather
    # than ~75 MB. Every planet is a jump target, so no map is left at 2K.
    buildCommand: npm ci && npm run build:deploy
    staticPublishPath: ./dist

    # Only rebuild when something that affects the output changes. Docs and
    # licence files do not.
    buildFilter:
      paths:
        - src/**
        - tools/**
        - index.html
        - vite.config.js
        - package.json
        - package-lock.json
        - render.yaml
      ignoredPaths:
        - "**/*.md"

    envVars:
      # Match the local toolchain. Vite 8 and the build scripts use modern
      # Node APIs, so do not let Render pick an older default.
      - key: NODE_VERSION
        value: "22"
      # Skip Puppeteer/Chromium style postinstall work that nothing here needs.
      - key: NPM_CONFIG_FUND
        value: "false"
      - key: NPM_CONFIG_AUDIT
        value: "false"

    headers:
      # Vite fingerprints the JS bundle, so it can be cached indefinitely.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

      # Textures, star binary and character models are large and effectively
      # static, but their names are not fingerprinted - cache for a week and
      # revalidate, so replacing a texture is picked up without a purge.
      - path: /tex/*
        name: Cache-Control
        value: public, max-age=604800, must-revalidate
      - path: /data/*
        name: Cache-Control
        value: public, max-age=604800, must-revalidate
      - path: /models/*
        name: Cache-Control
        value: public, max-age=604800, must-revalidate

      # The entry point must never be cached, or a deploy does not reach
      # anyone who has already visited.
      - path: /index.html
        name: Cache-Control
        value: no-cache

      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

    # Single page, no client-side router: there is nothing to rewrite. A
    # catch-all rewrite here would only mask genuine 404s, and the texture LOD
    # depends on a missing 8K file actually returning 404 so it can walk down
    # a level.
    routes: []
